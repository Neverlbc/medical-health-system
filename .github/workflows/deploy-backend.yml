# ============================================================
# 后端自动部署 — Spring Boot Maven → 阿里云 ECS
# ============================================================
# 触发条件：push 到 main 分支且 medical-backend/ 有变更
#
# ⚠️ 需要在 GitHub → Settings → Secrets and variables → Actions
#    中配置以下 Secrets：
#
#   SERVER_HOST        — 服务器公网 IP（阿里云 ECS）
#   SERVER_USER        — SSH 用户名（通常 root）
#   SERVER_SSH_KEY     — SSH 私钥（完整 PEM 格式）
#   SERVER_PORT        — SSH 端口（默认 22，可选）
#   DB_URL             — 生产数据库连接串（默认连接服务器 MySQL）
#   DB_USERNAME        — 生产数据库用户名（默认 root）
#   DB_PASSWORD        — 生产数据库密码（写入服务器环境文件）
#   JWT_SECRET         — JWT 密钥
#   DEEPSEEK_API_KEY   — DeepSeek API Key（可选）
# ============================================================

name: ⚙️ Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'medical-backend/**'
      - '.github/workflows/deploy-backend.yml'

  # 支持手动触发
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: medical-backend

    steps:
      # ---- 1. 检出代码 ----
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ---- 2. 配置 JDK 17 ----
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # ---- 3. 校验生产环境密钥 ----
      - name: 🔐 Validate production secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::DB_PASSWORD secret is required. Set it in GitHub repository Settings → Secrets and variables → Actions."
            exit 1
          fi

          if [ -z "$JWT_SECRET" ]; then
            echo "::warning::JWT_SECRET is not set; deployment will use the default development value."
          fi

      # ---- 4. Maven 构建（跳过测试加速部署） ----
      - name: 🏗️ Build with Maven
        run: mvn clean package -DskipTests -pl medical-admin -am

      # ---- 5. 验证 JAR 包 ----
      - name: ✅ Verify JAR artifact
        run: |
          JAR_PATH="medical-admin/target/medical-admin.jar"
          if [ ! -f "$JAR_PATH" ]; then
            echo "❌ JAR file not found: $JAR_PATH"
            exit 1
          fi
          echo "✅ JAR size: $(du -h $JAR_PATH | cut -f1)"

      # ---- 6. 上传构建产物 ----
      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: medical-backend/medical-admin/target/medical-admin.jar
          retention-days: 7

      # ---- 7. 初始化服务器环境（首次部署自动创建） ----
      - name: 🔧 Initialize server environment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # 创建部署目录
            mkdir -p /www/wwwroot/medical-backend/backup

            # 确保 JDK 17 已安装
            if ! java -version 2>&1 | grep -q "17"; then
              echo "📦 Installing JDK 17..."
              apt update && apt install -y openjdk-17-jdk
            fi
            echo "☕ Java: $(java -version 2>&1 | head -1)"

            # Systemd 服务会在每次部署时重写，确保数据库环境变量保持最新
            systemctl enable medical 2>/dev/null || true
            echo "✅ Server environment ready"

      # ---- 8. 部署 JAR 到服务器 ----
      - name: 📦 Upload JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: medical-backend/medical-admin/target/medical-admin.jar
          target: /tmp/medical-deploy/
          strip_components: 3

      # ---- 9. 部署并重启后端服务 ----
      - name: 🔄 Deploy and restart backend service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="/www/wwwroot/medical-backend"
            BACKUP_DIR="$DEPLOY_DIR/backup"
            SRC="/tmp/medical-deploy/medical-admin.jar"

            print_diagnostics() {
              echo "------ systemctl status medical ------"
              systemctl status medical --no-pager -l || true
              echo "------ journalctl -u medical.service ------"
              journalctl -u medical.service --no-pager -n 120 || true
              echo "------ listening ports ------"
              ss -lntp | grep ':8080' || true
              echo "------ application log ------"
              if [ -f "$DEPLOY_DIR/logs/medical-health.log" ]; then
                tail -n 120 "$DEPLOY_DIR/logs/medical-health.log" || true
              else
                echo "Application log not found: $DEPLOY_DIR/logs/medical-health.log"
              fi
            }

            echo "📋 Checking uploaded JAR..."
            if [ ! -f "$SRC" ]; then
              echo "❌ JAR not found at $SRC"
              echo "📂 Contents of /tmp/medical-deploy/:"
              find /tmp/medical-deploy/ -type f 2>/dev/null || echo "  (empty)"
              exit 1
            fi
            echo "✅ JAR found: $(du -h $SRC | cut -f1)"

            # 停止当前服务
            systemctl stop medical 2>/dev/null || true

            # 备份旧 JAR
            if [ -f "$DEPLOY_DIR/medical-admin.jar" ] && [ -s "$DEPLOY_DIR/medical-admin.jar" ]; then
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              cp "$DEPLOY_DIR/medical-admin.jar" "$BACKUP_DIR/medical-admin_${TIMESTAMP}.jar"
              ls -t "$BACKUP_DIR"/medical-admin_*.jar 2>/dev/null | tail -n +4 | xargs -r rm
            fi

            # 移动新 JAR 到部署目录
            mv "$SRC" "$DEPLOY_DIR/medical-admin.jar"
            echo "✅ JAR deployed to $DEPLOY_DIR/medical-admin.jar"

            # 写入生产环境变量。不要把数据库密码提交到仓库，由 GitHub Secrets 注入。
            cat > "$DEPLOY_DIR/.env" << 'ENVEOF'
            DB_URL=${{ secrets.DB_URL || 'jdbc:mysql://47.85.48.198:3306/medical_health?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true' }}
            DB_USERNAME=${{ secrets.DB_USERNAME || 'root' }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            REDIS_HOST=${{ secrets.REDIS_HOST || '127.0.0.1' }}
            REDIS_PORT=${{ secrets.REDIS_PORT || '6379' }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET || 'medical-health-secret-key-please-change' }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            ENVEOF
            sed -i 's/^            //' "$DEPLOY_DIR/.env"
            chmod 600 "$DEPLOY_DIR/.env"
            echo "📋 Runtime env written:"
            sed -E 's/(PASSWORD=).*/\1***/; s/(SECRET=).*/\1***/; s/(API_KEY=).*/\1***/' "$DEPLOY_DIR/.env"

            # 每次部署都重写服务，避免旧 service 继续使用本地数据库默认值
            cat > /etc/systemd/system/medical.service << 'SVCEOF'
            [Unit]
            Description=Medical Health System Backend
            After=network.target mysql.service redis.service redis-server.service

            [Service]
            User=root
            WorkingDirectory=/www/wwwroot/medical-backend
            EnvironmentFile=/www/wwwroot/medical-backend/.env
            ExecStart=/usr/bin/java -Xms512m -Xmx1024m -XX:+UseG1GC -jar medical-admin.jar
            SuccessExitStatus=143
            Restart=always
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
            SVCEOF
            sed -i 's/^            //' /etc/systemd/system/medical.service

            # 重启服务
            systemctl daemon-reload
            systemctl enable medical
            systemctl restart medical

            # 服务和接口健康检查。systemd 进程存在不代表 Spring Boot 已经可用。
            echo "⏳ Waiting for backend API..."
            API_READY=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/v3/api-docs >/tmp/medical-api-docs.json; then
                API_READY=1
                break
              fi
              sleep 2
            done

            if [ "$API_READY" != "1" ]; then
              echo "❌ Backend API did not become ready on 127.0.0.1:8080."
              print_diagnostics
              exit 1
            fi

            LOGIN_CHECK=$(curl -sS -X POST http://127.0.0.1:8080/api/v1/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"__deploy_probe__","password":"__deploy_probe__"}' || true)

            if ! echo "$LOGIN_CHECK" | grep -q '"code":40003'; then
              echo "❌ Backend API is reachable, but login probe did not return the expected database-backed response."
              echo "$LOGIN_CHECK"
              print_diagnostics
              exit 1
            fi

            echo "✅ Backend service and database-backed login endpoint are healthy!"
            systemctl status medical --no-pager -l | head -20
